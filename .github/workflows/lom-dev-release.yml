name: LoM DEV Release

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  release-windows-dev:
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Fix node-gyp Python packages
        shell: pwsh
        run: python3 -m pip install --break-system-packages --user packaging setuptools

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        id: release
        shell: pwsh
        run: |
          $release = Get-Content 'lom/release.json' -Raw | ConvertFrom-Json
          $app = Get-Content 'xmcl-electron-app/package.json' -Raw | ConvertFrom-Json
          $root = Get-Content 'package.json' -Raw | ConvertFrom-Json
          if ($release.version -ne $app.version) { throw "release.json version $($release.version) != app version $($app.version)" }
          if ($release.version -ne $root.version) { throw "release.json version $($release.version) != root version $($root.version)" }

          $publishAsar = $false
          if ($release.PSObject.Properties.Name -contains 'inAppUpdate') {
            $publishAsar = [bool]$release.inAppUpdate
          }

          $channel = 'stable'
          if ($release.PSObject.Properties.Name -contains 'channel') {
            $channel = [string]$release.channel
          }
          if ($channel -ne 'stable' -and $channel -ne 'dev') {
            throw "release.json channel must be 'stable' or 'dev', got '$channel'"
          }

          "version=$($release.version)" >> $env:GITHUB_OUTPUT
          "tag=v$($release.version)" >> $env:GITHUB_OUTPUT
          "publish_asar=$($publishAsar.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Run LoM regression tests
        run: pnpm vitest run xmcl-runtime/infra/plugins/task.test.ts packages/instance/managed.test.ts xmcl-keystone-ui/src/composables/lomProfile.test.ts xmcl-runtime/launch/managedInstanceLaunch.test.ts xmcl-runtime/launch/minecraftLocale.test.ts xmcl-runtime/instanceIO/lomDistribution.test.ts

      - name: Build LoM Launcher
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NODE_OPTIONS: --max-old-space-size=32768
          NODE_ENV: production
          RELEASE: false
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          pnpm run --prefix xmcl-keystone-ui build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run --prefix xmcl-electron-app build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate LoM Windows build
        shell: pwsh
        run: |
          $dir = 'xmcl-electron-app/build/output/win-unpacked'
          if (!(Test-Path "$dir/LoM Launcher.exe")) { throw 'LoM Launcher.exe is missing from the Windows build' }
          if (Test-Path "$dir/XMCL.exe") { throw 'Unexpected XMCL.exe found in the LoM release build' }
          if (!(Test-Path "$dir/resources/app.asar")) { throw 'resources/app.asar is missing from the Windows build' }

      - name: Build Windows installer
        id: installer
        shell: pwsh
        run: |
          pnpm run --prefix xmcl-electron-app build:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = Get-ChildItem 'xmcl-electron-app/build/output/LoM-Launcher-Setup-*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'NSIS installer was not produced' }
          if (!(Test-Path ($exe.FullName + '.sha256'))) { throw 'Installer sha256 was not produced' }

          "installer=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "installer_sha=$($exe.FullName).sha256" >> $env:GITHUB_OUTPUT

      - name: Package Windows x64 portable build
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $zip = "LoM-Launcher-v$version-windows-x64.zip"
          $zipSha = "$zip.sha256"

          Compress-Archive -Path 'xmcl-electron-app/build/output/win-unpacked/*' -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $zip" | Set-Content -NoNewline $zipSha

          "zip=$zip" >> $env:GITHUB_OUTPUT
          "zip_sha=$zipSha" >> $env:GITHUB_OUTPUT

      - name: Package in-app updater payload
        id: asar
        if: steps.release.outputs.publish_asar == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $asar = "app-$version-win.asar"
          $asarSha = "$asar.sha256"

          Copy-Item 'xmcl-electron-app/build/output/win-unpacked/resources/app.asar' $asar
          $asarHash = (Get-FileHash $asar -Algorithm SHA256).Hash.ToLowerInvariant()
          "$asarHash  $asar" | Set-Content -NoNewline $asarSha

          "asar=$asar" >> $env:GITHUB_OUTPUT
          "asar_sha=$asarSha" >> $env:GITHUB_OUTPUT

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v6
        with:
          name: LoM-Launcher-v${{ steps.release.outputs.version }}-windows-x64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip_sha }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: LoM-Launcher-v${{ steps.release.outputs.version }}-windows-installer
          path: |
            ${{ steps.installer.outputs.installer }}
            ${{ steps.installer.outputs.installer_sha }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload in-app updater artifact
        if: steps.release.outputs.publish_asar == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: LoM-Launcher-v${{ steps.release.outputs.version }}-in-app-update
          path: |
            ${{ steps.asar.outputs.asar }}
            ${{ steps.asar.outputs.asar_sha }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            throw "GitHub release $tag already exists"
          }

          $assets = @(
            '${{ steps.package.outputs.zip }}',
            '${{ steps.package.outputs.zip_sha }}',
            '${{ steps.installer.outputs.installer }}',
            '${{ steps.installer.outputs.installer_sha }}'
          )
          if ('${{ steps.release.outputs.publish_asar }}' -eq 'true') {
            $assets += @(
              '${{ steps.asar.outputs.asar }}',
              '${{ steps.asar.outputs.asar_sha }}'
            )
          }

          $channelFlags = @()
          if ('${{ steps.release.outputs.channel }}' -eq 'dev') {
            $channelFlags += '--prerelease'
          } else {
            $channelFlags += '--latest'
          }

          gh release create $tag @assets `
            @channelFlags `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'LoM Launcher v${{ steps.release.outputs.version }}' `
            --notes-file 'lom/RELEASE_NOTES.md'
