name: Test Instance Cancel Windows

on:
  push:
    branches:
      - fix/instance-download-cancel

jobs:
  windows-test-build:
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - name: Fix node-gyp and Python
        run: python3 -m pip install --break-system-packages --user packaging setuptools
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Regression test
        run: pnpm vitest run xmcl-runtime/infra/plugins/task.test.ts
      - name: Build Windows launcher
        run: |
          pnpm run --prefix xmcl-keystone-ui build
          pnpm run --prefix xmcl-electron-app build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NODE_OPTIONS: --max-old-space-size=32768
          NODE_ENV: production
          RELEASE: false
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
      - name: Upload Windows test build
        uses: actions/upload-artifact@v6
        with:
          name: lom-instance-cancel-test-win-b${{ github.run_number }}
          path: xmcl-electron-app/build/output/win-unpacked/
          if-no-files-found: error
