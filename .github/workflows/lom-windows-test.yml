name: LoM Windows Test Build

on:
  push:
    branches:
      - master
      - 'fix/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Fix node-gyp Python packages
        shell: pwsh
        run: python3 -m pip install --break-system-packages --user packaging setuptools

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test LoM distribution adapter
        run: pnpm vitest run xmcl-runtime/instanceIO/lomDistribution.test.ts

      - name: Validate live LoM pack distribution
        shell: pwsh
        run: |
          @'
          import { normalizeLoMManifest } from './xmcl-runtime/instanceIO/lomDistribution.ts'

          async function main() {
            const source = 'https://raw.githubusercontent.com/nondename/Minecraft-Legends-of-Medieval/dev/distribution.json'
            const response = await fetch(source, { cache: 'no-store' })
            if (!response.ok) throw new Error(`distribution HTTP ${response.status}`)
            const manifest = normalizeLoMManifest(await response.json(), source)
            const activeJars = manifest.files.filter((file) => file.path.startsWith('mods/') && file.path.endsWith('.jar'))
            const disabledJars = manifest.files.filter((file) => file.path.startsWith('mods/') && file.path.endsWith('.jar.deactivation'))
            console.log(`LoM distribution version=${manifest.version} files=${manifest.files.length} activeMods=${activeJars.length} disabledMods=${disabledJars.length}`)
            if (activeJars.length < 100) throw new Error(`Suspiciously small LoM mod set: ${activeJars.length}`)
            if (!manifest.files.some((file) => file.path === 'options.txt')) throw new Error('options.txt missing from normalized manifest')
          }

          void main().catch((error) => {
            console.error(error)
            process.exitCode = 1
          })
          '@ | Set-Content -Encoding utf8 .lom-validate-distribution.ts
          pnpm tsx .lom-validate-distribution.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item .lom-validate-distribution.ts -Force

      - name: Build LoM launcher
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NODE_OPTIONS: --max-old-space-size=32768
          NODE_ENV: production
          RELEASE: false
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          pnpm run --prefix xmcl-keystone-ui build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run --prefix xmcl-electron-app build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate LoM executable
        shell: pwsh
        run: |
          if (!(Test-Path 'xmcl-electron-app/build/output/win-unpacked/LoM Launcher.exe')) {
            throw 'LoM Launcher.exe is missing from Windows build'
          }

      - name: Upload Windows unpacked build
        uses: actions/upload-artifact@v6
        with:
          name: lom-windows-b${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: xmcl-electron-app/build/output/win-unpacked/
